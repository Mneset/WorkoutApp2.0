events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend_up {
        server backend:3000;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # Vite's hashed build assets are immutable: cache hard, and return 404 for a
        # missing file instead of falling back to index.html (which would blank-screen
        # a browser holding a stale shell after a redeploy).
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA routes fall back to index.html, which must always be revalidated so a
        # new deploy is picked up immediately.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }

        location /api {
            proxy_pass http://backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
